site_name: "GitHub Copilot og Power Apps Code Apps: veiledning for innføring"
site_description: "Adopsjonsveiledning for norske virksomheter som vil ta i bruk GitHub Copilot sammen med Power Apps Code Apps: strategi, styring, arbeidsflyt og måling."
site_url: https://gakinchi.github.io/copilot-code-apps-guidance/
repo_url: https://github.com/Gakinchi/copilot-code-apps-guidance
repo_name: copilot-code-apps-guidance
edit_uri: edit/main/docs/
copyright: "Dennis Chi, recursion.no. Innholdet er veiledning, ikke juridisk rådgivning. Verifiser alltid mot Microsoft Learn og GitHub Docs før du lover noe."

theme:
  name: material
  language: nb
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Bytt til mørkt tema
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Bytt til lyst tema

plugins:
  - search:
      lang:
        - "no"
        - en
  - tags
  - glightbox
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: nb
          name: Norsk
          default: true
          build: true
        - locale: en
          name: English
          build: false
  - git-revision-date-localized:
      type: date
      locale: nb
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

